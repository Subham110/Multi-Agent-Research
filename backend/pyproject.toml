[project]
name = "researchmesh-backend"
version = "1.0.0"
description = "Production multi-agent AI research system"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "celery[redis]==5.5.3",
  "fastapi==0.139.2",
  "email-validator==2.2.0",
  "feedparser==6.0.11",
  "google-genai==2.13.0",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.0",
  "orjson==3.11.5",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pwdlib[argon2]==0.2.1",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "PyMuPDF==1.26.3",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy==2.0.41",
  "structlog==25.4.0",
  "tenacity==9.1.4",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7"
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]